name: wms-laravel-project
description: WMS - система управления складом на Laravel 12 с Vue 3 frontend

# Информация о репозитории
repository:
  url: https://github.com/origamiv/ourcrm_wms.git
  provider: github.com
  branch: master
  
# Базовый образ с PHP и Node.js
base_image: ubuntu:22.04

# Системные зависимости
system_packages:
  - curl
  - git
  - unzip
  - software-properties-common
  - gnupg2
  - ca-certificates
  - lsb-release
  - apt-transport-https
  - postgresql-client
  - redis-tools
  - nginx

# PHP установка и настройка
setup_commands:
  - |
    # Установка PHP 8.2 и расширений
    add-apt-repository ppa:ondrej/php -y
    apt update
    apt install -y php8.2 php8.2-cli php8.2-fpm php8.2-common php8.2-mysql php8.2-pgsql \
      php8.2-zip php8.2-gd php8.2-mbstring php8.2-curl php8.2-xml php8.2-bcmath \
      php8.2-redis php8.2-simplexml php8.2-intl php8.2-soap php8.2-imap

  - |
    # Установка Composer
    curl -sS https://getcomposer.org/installer | php
    mv composer.phar /usr/local/bin/composer
    chmod +x /usr/local/bin/composer

  - |
    # Установка Node.js 20
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    apt install -y nodejs

  - |
    # Конфигурация PHP
    echo "memory_limit = 512M" >> /etc/php/8.2/cli/php.ini
    echo "max_execution_time = 300" >> /etc/php/8.2/cli/php.ini
    echo "post_max_size = 50M" >> /etc/php/8.2/cli/php.ini
    echo "upload_max_filesize = 50M" >> /etc/php/8.2/cli/php.ini

# Переменные окружения для разработки
environment_variables:
  APP_ENV: development
  APP_DEBUG: "true"
  APP_NAME: "WMS Development"
  APP_URL: "http://localhost:8000"
  APP_TIMEZONE: "Europe/Moscow"
  
  # База данных (используем SQLite для простоты в cloud environment)
  DB_CONNECTION: sqlite
  DB_DATABASE: /workspace/database/database.sqlite
  
  # Cache и сессии
  CACHE_STORE: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  
  # Отключаем внешние сервисы для разработки
  MAIL_MAILER: log
  BROADCAST_CONNECTION: log
  
  # Vite
  VITE_APP_NAME: "WMS Development"

# Команды инициализации проекта
init_commands:
  - composer install --no-interaction --prefer-dist --optimize-autoloader
  - npm ci
  - |
    # Создание базы данных SQLite если её нет
    mkdir -p database
    if [ ! -f database/database.sqlite ]; then
      touch database/database.sqlite
    fi
  - |
    # Копирование .env файла если его нет
    if [ ! -f .env ]; then
      cp .env.example .env
      php artisan key:generate --force
    fi
  - php artisan migrate --force
  - npm run build
  - php artisan optimize:clear

# Команды для запуска проекта
start_commands:
  # Запуск Laravel development server
  - name: laravel-server
    command: php artisan serve --host=0.0.0.0 --port=8000
    description: "Laravel development server"

  # Запуск Vite для frontend development
  - name: vite-dev
    command: npm run dev
    description: "Vite development server"

  # Запуск очередей (если нужно)
  - name: queue-worker
    command: php artisan queue:work --tries=3
    description: "Laravel queue worker"
    optional: true

# Открываемые порты
exposed_ports:
  - 8000  # Laravel server
  - 5173  # Vite dev server

# Настройки для работы с файлами
file_watchers:
  - "**/*.php"
  - "**/*.vue" 
  - "**/*.ts"
  - "**/*.js"
  - "**/*.css"
  - "resources/**/*"

# Исключения из синхронизации
ignore_patterns:
  - node_modules/
  - vendor/
  - storage/logs/
  - storage/framework/cache/
  - storage/framework/sessions/
  - storage/framework/views/
  - bootstrap/cache/
  - .env
  - .env.*
  - database/database.sqlite